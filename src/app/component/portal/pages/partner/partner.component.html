<div class="action-button" style="clear: bottom;overflow: hidden;">
  <div class="form-group" style="float: left">
    <h1>Danh sách doanh nghiệp sử dụng dịch vụ</h1>
  </div>
  <div class="form-group" style="float: right; display: flex; float: right">


    <!-- Tìm kiếm -->
    <input style="width: 200px; border-radius: 4px; height: 32px;" class="mgr10" nzSize="small" nz-input type="text"
      [(ngModel)]="searchText" (keyup)="onSearch()" placeholder="Tìm kiếm theo tên, username, ...">

    <button nz-button nzType="primary" class="btn-add-asset" type="button" (click)="showModalAdd()" *ngIf="checkAdd">
      <em class="fas fa-plus fa-fw"></em> Thêm mới
    </button>

    <!-- Nút xuất Excel -->
    <button nz-button nzType="primary" class="btn-green mgr10" (click)="exportData()">
      <span class="fa fa-fw fa-file-excel" style="margin-right: 4px;"></span>
      Xuất Excel
    </button>
  </div>
</div>


<dx-data-grid id="gridContainer" [dataSource]="filteredDatas" #ListAccount [showColumnLines]="true"
  [showRowLines]="true" [height]="dxGridHeight" [rowAlternationEnabled]="true" [showBorders]="true"
  [allowColumnResizing]="true" columnResizingMode="widget" [columnMinWidth]="50" [columnAutoWidth]="true"
  (onExporting)="onExporting($event)">
  <dxo-sorting mode="multiple"></dxo-sorting>
  <dxo-header-filter [visible]="true"></dxo-header-filter>
  <dxo-filter-row [visible]="true" [applyFilter]="currentFilter"></dxo-filter-row>

  <dxo-paging [pageSize]="10"> </dxo-paging>
  <dxo-scrolling rowRenderingMode="virtual"> </dxo-scrolling>
  <dxo-pager [visible]="true" [allowedPageSizes]="allowedPageSizes" [displayMode]="displayMode"
    [showPageSizeSelector]="showPageSizeSelector" [showInfo]="showInfo"
    [showNavigationButtons]="showNavButtons"></dxo-pager>


  <dxi-column cssClass="text-center" caption="Action" [fixed]="true" [width]="170" fixedPosition="right"
    cellTemplate="cellBtnTemplate"></dxi-column>

  <dxi-column cssClass="text-center" caption="STT" [width]="55" dataField="stt" [fixed]="true" [allowFiltering]="false"
    [allowSorting]="false"></dxi-column>
  <dxi-column caption="Tên doanh nghiệp" [width]="200" dataField="companyName"></dxi-column>
  <dxi-column caption="Tên chủ doanh nghiệp" [fixed]="true" dataField="name" [width]="200"></dxi-column>
  <dxi-column caption="Mã số thuế" [width]="120" dataField="taxCode"></dxi-column>
  <dxi-column caption="Số điện thoại" [width]="150" dataField="phone"></dxi-column>
  <dxi-column caption="Email" dataField="email" [width]="200"></dxi-column>
  <dxi-column caption="Địa chỉ" [width]="200" dataField="address"></dxi-column>
  <dxi-column caption="Công nợ tối đa" [width]="200" dataField="debtMax" [format]="formatCurrencyVND"></dxi-column>
  <dxi-column caption="Công nợ đã sử dụng" [width]="200" dataField="debtUsed" [format]="formatCurrencyVND"></dxi-column>
  <dxi-column caption="Công nợ còn lại" [width]="200" dataField="debtRemain" [format]="formatCurrencyVND"></dxi-column>
  <dxi-column caption="Giấy phép kinh doanh" [width]="450" cellTemplate="cellBusinessLicenses"></dxi-column>
  <dxi-column caption="Hợp đồng" [width]="450" cellTemplate="cellContract"></dxi-column>
  <dxi-column caption="Ghi chú" [width]="350" dataField="note"></dxi-column>
  <dxi-column caption="Thời gian đăng ký" dataField="dateCreated" [width]="150" dataType="date" format="dd/MM/yyyy">
  </dxi-column>

  <div *dxTemplate="let partner of 'cellBusinessLicenses'">
    <ng-container *ngIf="partner.data.partnerFile">
      <div style="display: flex; flex-direction: column;">
        <div *ngFor="let file of partner.data.partnerFile; let i = index">
          <a *ngIf="file.type == 1" href="{{toFullPath(file.filePath)}}" target="_blank">
            <i nz-icon nzType="file-pdf" nzTheme="outline"></i> {{file.fileName}}</a>
        </div>
      </div>
      <div style="margin-top: 0.5rem; display: flex; justify-content: end;">
        <button nz-button nzSize="small" nzType="dashed" (click)="openModalUpload(partner.data, TypeOfDocument.BusinessLicenseFile)"><span nz-icon
            nzType="sync" nzTheme="outline"></span>Cập nhật GPKD cho {{partner.data.companyName}}</button>
      </div>
    </ng-container>
  </div>
  <div *dxTemplate="let partner of 'cellContract'" (click)="openModalUpload(partner.data, TypeOfDocument.ContractFile)">
    <ng-container *ngIf="partner.data.partnerFile">
      <div style="display: flex; flex-direction: column;">
        <div *ngFor="let file of partner.data.partnerFile; let i = index">
          <a *ngIf="file.type == 2" href="{{toFullPath(file.filePath)}}" target="_blank">
            <i nz-icon nzType="file-pdf" nzTheme="outline"></i> {{file.fileName}}</a>
        </div>
      </div>
      <div style="margin-top: 0.5rem; display: flex; justify-content: end;">
        <button nz-button nzSize="small" nzType="dashed" (click)="openModalUpload(partner.data, 2)"><span nz-icon
            nzType="sync" nzTheme="outline"></span>Cập nhật HĐ cho {{partner.data.companyName}}</button>
      </div>
    </ng-container>
  </div>
  <div *dxTemplate="let item of 'cellBtnTemplate'">
    <button title="Xóa tài khoản" nz-button nzSize="small" nzType="default" class="btn-right button-update ant-btn-red"
      (click)="showDeleteConfirm(item.data)" *ngIf="checkUpdate">
      <span class="fa fa-times fa-fw"></span>
    </button>
    <button title="Thiết lập lại công nợ" nz-button nzSize="small" nzType="default" class="btn-right button-update"
      (click)="onResetDebtForPartnerByID(item.data)">
      <span class='fas fa-undo'></span>
    </button>
    <button title="Sửa thông tin tài khoản" nz-button nzSize="small" nzType="default" class="btn-right button-update"
      (click)="showModalUpdate(item.data)" *ngIf="checkUpdate">
      <span class="fa fa-edit fa-fw"></span>
    </button>
    <button *ngIf="!item.data.userId" title="Tạo tài khoản" nz-button nzSize="small" nzType="default"
      class="btn-right button-update" (click)="showModalAccount(item.data)">
      <span class="fa fa-user fa-fw"></span>
    </button>
    <button *ngIf="item.data.userId" title="Đổi mật khẩu" nz-button nzSize="small" nzType="default"
      class="btn-right button-update" (click)="showModalAccount(item.data)">
      <!-- <button *ngIf="item.data.userId" title="Đổi mật khẩu" nz-button nzSize="small" nzType="default" class="btn-right button-update"
      (click)="showModalPassword(item.data)"> -->
      <span class="fa fa-key fa-fw"></span>
    </button>

  </div>

  <dxo-summary>
    <dxi-total-item column="name" displayFormat="Số bản ghi: {0}" summaryType="count">
    </dxi-total-item>
  </dxo-summary>
</dx-data-grid>

<!-- Tạo mới thông tin đối tác -->
<form [formGroup]="formAdd">
  <nz-modal [(nzVisible)]="isVisibleAdd" nzClosable="false" nzMaskClosable="false">
    <div *nzModalTitle>
      {{titleFormPartner}}
      <div class="pull-right icon-close">
        <em (click)="handleCancel()" nz-icon nzType="close" nzTheme="outline"></em>
      </div>
    </div>
    <div *nzModalContent>
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Tên chủ doanh nghiệp<em
            class="fas fa-asterisk required"></em></label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="name" [ngClass]="{ 'is-invalid': submitted && f.name.errors?.required}" />
        </div>
      </div>
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Tên doanh nghiệp<em
            class="fa fa-asterisk required"></em></label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="companyName"
            [ngClass]="{ 'is-invalid': submitted && f.companyName.errors?.required}" />
        </div>
      </div>
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Mã số thuế<em class="fas fa-asterisk required"></em></label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="taxCode"
            [ngClass]="{ 'is-invalid': submitted && f.taxCode.errors?.required }" />
        </div>
      </div>
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Số điện thoại</label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="phone" #inputElementNumberPhone
            (ngModelChange)="onChangeNumberPhone($event)">
        </div>
      </div>
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Email<em class="fas fa-asterisk required"></em></label>
        <div nz-col [nzSpan]="16">
          <input type="email" nz-input formControlName="email"
            [ngClass]="{ 'is-invalid': submitted && f.email.errors?.required }" />
        </div>
      </div>
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Địa chỉ<em class="fas fa-asterisk required"></em></label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="address"
            [ngClass]="{ 'is-invalid': submitted && f.address.errors?.required }" />
        </div>
      </div>
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Công nợ tối đa</label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="debtMax" />
        </div>
      </div>
      <!-- <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Công nợ đã sử dụng</label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="debtUsed" />
        </div>
      </div> -->
      <!-- <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Công nợ còn lại</label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="debtRemain" />
        </div>
      </div> -->
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Ghi chú</label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="note" />
        </div>
      </div>
    </div>
    <!-- Footer -->
    <div *nzModalFooter>
      <button nz-button (click)="handleCancel()">{{'cancel' | translate }}</button>
      <button nz-button nzType="primary" (click)="handleOk()" class="button-submit">{{'save' | translate }}</button>
    </div>
  </nz-modal>
</form>

<form [formGroup]="formPassword">
  <nz-modal [(nzVisible)]="isVisiblePassword" nzClosable="false" [nzTitle]="titlePassword" nzMaskClosable="false">
    <ng-template #titlePassword>
      Đổi mật khẩu
      <div class="pull-right icon-close">
        <em (click)="handleCancelPassword()" nz-icon nzType="close" nzTheme="outline"></em>
      </div>
    </ng-template>
    <div class="input-wrap">
      <label class="title-detail" nz-col [nzSpan]="8">Mật khẩu<em class="fa fa-asterisk required"></em></label>
      <nz-input-group style="width: auto !important;" [nzSuffix]="suffixTemplate" nz-col [nzSpan]="16">
        <input [type]="passwordVisible ? 'text' : 'password'" nz-input placeholder="Nhập mật khẩu"
          autocomplete="new-password" formControlName="password" />
      </nz-input-group>
      <ng-template #suffixTemplate>
        <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
          (click)="passwordVisible = !passwordVisible"></i>
      </ng-template>
    </div>
    <div class="input-wrap">
      <label class="title-detail" nz-col [nzSpan]="8">Nhắc lại<em class="fa fa-asterisk required"></em></label>
      <nz-input-group style="width: auto !important;" [nzSuffix]="suffixRepeatTemplate" nz-col [nzSpan]="16">
        <input [type]="repeatpasswordVisible ? 'text' : 'password'" nz-input placeholder="Nhập lại mật khẩu"
          autocomplete="new-password" formControlName="repeatPassword" />
      </nz-input-group>
      <ng-template #suffixRepeatTemplate>
        <i nz-icon [nzType]="repeatpasswordVisible ? 'eye-invisible' : 'eye'"
          (click)="repeatpasswordVisible = !repeatpasswordVisible"></i>
      </ng-template>
    </div>
    <!-- Footer -->
    <div *nzModalFooter>
      <button nz-button (click)="handleCancelPassword()">{{'cancel' | translate }}</button>
      <button nz-button nzType="primary" (click)="handleOkPassword()" class="button-submit">{{'save' | translate
        }}</button>
    </div>
  </nz-modal>
</form>

<!--Thêm tài khoản đối tác con-->
<nz-modal (nzOnCancel)="handleCancel()" [(nzVisible)]="isVisibleAddAccount" [nzTitle]="titleaccount2"
  [nzContent]="contentaccount2" [nzFooter]="footeraccount2">
  <ng-template #titleaccount2>{{ !isEnableUsername ? 'Thêm tài khoản':'Đổi mật khẩu'}}</ng-template>
  <ng-template #contentaccount2>
    <form nz-form [formGroup]="formAccount">
      <div nz-row class="input-wrap nz-row">
        <label class="title-detail" nz-col [nzSpan]="8" nzRequired nzFor="fullname">Họ và tên</label>
        <div nz-col [nzSpan]="16" nzErrorTip="The input is not valid fullname!">
          <input nz-input [readonly]="true" formControlName="fullname" placeholder="Họ và tên" />
        </div>
      </div>
      <div nz-row class="input-wrap nz-row">
        <label class="title-detail" nz-col [nzSpan]="8" nzRequired>Email</label>
        <div nz-col [nzSpan]="16">
          <input [readonly]="true" nz-input placeholder="Email" formControlName="email" />
        </div>
      </div>
      <div nz-row class="input-wrap nz-row">
        <label class="title-detail" nz-col [nzSpan]="8" nzRequired>Tên tài khoản</label>
        <div nz-col [nzSpan]="16">
          <input [readonly]="isEnableUsername" nz-input placeholder="Tên tài khoản" formControlName="username"
            autocomplete="new-password" />
        </div>
      </div>
      <div nz-row class="input-wrap nz-row">
        <label class="title-detail" nz-col [nzSpan]="8" nzFor="password" nzRequired>Mật khẩu</label>
        <div nz-col [nzSpan]="16">
          <nz-input-group [nzSuffix]="suffixTemplate">
            <input nz-input formControlName="password" [type]="passwordVisible ? 'text' : 'password'"
              autocomplete="new-password" />
            <ng-template #suffixTemplate>
              <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
                (click)="passwordVisible = !passwordVisible"></i>
            </ng-template>
          </nz-input-group>
        </div>
      </div>
      <div nz-row class="input-wrap nz-row">
        <label class="title-detail" nz-col [nzSpan]="8" nzFor="repeatPassword" nzRequired>Lặp lại mật khẩu</label>
        <div nz-col [nzSpan]="16">
          <nz-input-group [nzSuffix]="suffixRepeatTemplate">
            <input nz-input [type]="repeatpasswordVisible ? 'text' : 'password'" formControlName="repeatPassword"
              autocomplete="new-password" />
            <ng-template #suffixRepeatTemplate>
              <i nz-icon [nzType]="repeatpasswordVisible ? 'eye-invisible' : 'eye'"
                (click)="repeatpasswordVisible = !repeatpasswordVisible"></i>
            </ng-template>
          </nz-input-group>
        </div>
      </div>
    </form>
  </ng-template>
  <ng-template #footeraccount2>
    <button nz-button nzType="dashed" (click)="handleCancel()">{{'cancel' | translate }}</button>
    <button nz-button nzType="primary" (click)="handleOkAddAccount()">{{'save' | translate }}</button>
  </ng-template>
</nz-modal>

<!-- Tải file kết quả -->
<nz-modal nzTitle='Tải file kết quả' [nzWidth]="700" [(nzVisible)]="visibleUpload" (nzOnCancel)="closeModalUpload()">
  <div *nzModalContent>
    <div *ngIf="curFileResults.length > 0" class="mgb30">
      <b>Các file đã upload</b>
      <div class="ant-upload-list">
        <div *ngFor="let file of curFileResults" class="ant-upload-list-text-container">
          <div class="ant-upload-list-item">
            <div class="ant-upload-list-item-info">
              <span class="ant-upload-span">
                <div class="ant-upload-text-icon">
                  <i nz-icon nzType="paper-clip"></i>
                </div>
                <span class="ant-upload-list-item-name"
                  (click)="openPreviewFileResult($event, file.filePath)">{{file.id}}-{{file.fileName}}</span>
                <span class="ant-upload-list-item-card-actions">
                  <i nz-icon nzType="delete" (click)="removeResult(file)"></i>
                </span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <nz-upload [nzAction]="uploadUrl" nzName="postedFile" [nzHeaders]="uploadHeader" [nzPreview]="handlePreview"
      [nzRemove]="handleRemove"
      [nzShowUploadList]="{showPreviewIcon:true, showRemoveIcon:true, showDownloadIcon: false}"
      (nzChange)="handleChange($event)">
      <button nz-button>
        <span nz-icon nzType="upload"></span>
        Click to Upload
      </button>
    </nz-upload>
  </div>
  <div *nzModalFooter>
    <button nz-button nzType="default" (click)="closeModalUpload()">Đóng</button>
    <button nz-button nzType="primary" [disabled]="newFileResults.length == 0" (click)="saveFileResult()">Lưu</button>
  </div>
</nz-modal>

<nz-modal nzClassName="slide-image" [(nzVisible)]="previewFileResult" (nzOnCancel)="closePdf()" [nzFooter]="null">
  <div class="pdf-viewer-container">
    <app-m-view-pdf [pdfDocumentSrc]="previewUrl"></app-m-view-pdf>
  </div>
</nz-modal>
