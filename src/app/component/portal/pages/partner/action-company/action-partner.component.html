<div class="content-create-company">
  <div nz-row [nzGutter]="[16, 24]">
    <div nz-col class="gutter-row" [nzSpan]="24">
      <div class="inner-box" style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 500; font-size: 18px;">Thêm mới doanh nghiệp</span>
        <div>
          <button nz-button nzType="default" style="margin-right: 8px;">
            <div style="display: flex; align-items: center;">
              <span nz-icon nzType="send"></span>
              <span style="margin-left: 6px; line-height: normal;">Gửi duyệt</span>
            </div>
          </button>
          <button nz-button nzType="text">
            <div style="display: flex; align-items: center;">
              <span nz-icon nzType="close"></span>
              <span style="margin-left: 4px; line-height: normal;">Huỷ bỏ</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div nz-row [nzGutter]="[16, 24]">
    <div nz-col class="gutter-row" [nzSpan]="24">
      <div class="inner-box">
        <!-- Header Base Information -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: 500; font-size: 18px;">Thêm tin cơ bản</span>
          <div>
            <button nz-button nzType="primary" style="margin-right: 8px;">
              <div style="display: flex; align-items: center;">
                <span nz-icon nzType="save"></span>
                <span style="margin-left: 6px; line-height: normal;">Lưu lại</span>
              </div>
            </button>
            <button nz-button nzType="default">
              <div style="display: flex; align-items: center;">
                <span nz-icon nzType="close"></span>
                <span style="margin-left: 4px; line-height: normal;">Huỷ bỏ</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Content Base Information -->
        <div>
          <div style="height: 1px; margin: 16px 0; background-color: #0000000f;"></div>
          <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }">
            <div nz-col class="gutter-row" [nzSpan]="12">
              <div>
                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6">
                    Trạng thái
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    Đang tạo hồ sơ
                  </div>
                </div>

                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    Mã tạo hồ sơ
                    <span style="color: tomato; margin-left: 4px;">*</span>
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <input style="border-radius: 4px;" nzSize="small" nz-input type="text"
                      placeholder="Nhập mã doanh nghiệp">
                  </div>
                </div>

                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    Tên doanh nghiệp
                    <span style="color: tomato; margin-left: 4px;">*</span>
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <input style="border-radius: 4px;" nzSize="small" nz-input type="text"
                      placeholder="Nhập tên doanh nghiệp">
                  </div>
                </div>

                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    Mã số thuế
                    <span style="color: tomato; margin-left: 4px;">*</span>
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <input style="border-radius: 4px;" nzSize="small" nz-input type="text"
                      placeholder="Nhập mã số thuế">
                  </div>
                </div>

                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    Cho phép công nợ
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <nz-radio-group>
                      <label nz-radio nzValue=1>Có</label>
                      <label nz-radio nzValue=0>Không</label>
                    </nz-radio-group>
                  </div>
                </div>
              </div>
            </div>
            <div nz-col class="gutter-row" [nzSpan]="12">
              <div>
                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    Số điện thoại
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <input style="border-radius: 4px;" nzSize="small" nz-input type="text"
                      placeholder="Nhập điện thoại doanh nghiệp">
                  </div>
                </div>

                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    Email doanh nghiệp
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <input style="border-radius: 4px;" nzSize="small" nz-input type="text"
                      placeholder="Nhập email doanh nghiệp">
                  </div>
                </div>

                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    Địa chỉ doanh nghiệp
                    <span style="color: tomato; margin-left: 4px;">*</span>
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <input style="border-radius: 4px;" nzSize="small" nz-input type="text"
                      placeholder="Nhập địa chỉ doanh nghiệp">
                  </div>
                </div>

                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    Chủ doanh nghiệp
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <input style="border-radius: 4px;" nzSize="small" nz-input type="text"
                      placeholder="Nhập chủ doanh nghiệp">
                  </div>
                </div>

                <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
                  style="display: flex; align-items: center; padding: 8px 0;">
                  <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                    File giấy uỷ quyền
                  </div>
                  <div nz-col class="gutter-row" [nzSpan]="12">
                    <nz-upload nzAction="https://www.mocky.io/v2/5cc8019d300000980a055e76"
                      [nzHeaders]="{ authorization: 'authorization-text' }" (nzChange)="handleChange($event)">
                      <button nz-button nzType="default" [nzSize]="'default'" nzShape="round"><span nz-icon
                          nzType="upload"></span></button>
                    </nz-upload>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>




    </div>
  </div>
  <div nz-row [nzGutter]="[16, 24]">
    <div nz-col class="gutter-row" [nzSpan]="24">
      <div class="inner-box">
        <ul nz-menu nzMode="horizontal">
          <li nz-menu-item [nzSelected]="selectedMenu == option.value"
            *ngFor="let option of MENU_CREATE_PARTNER_OPTION; let i = index" (click)="selectedMenu = option.value">
            {{option.label}}
          </li>
        </ul>
        <div style="margin: 16px 0;"></div>

        <div *ngIf="selectedMenu == MenuCreatePartner.DebtManagement">
          DebtManagement
        </div>
        <div *ngIf="selectedMenu == MenuCreatePartner.ListEmployees">
          <h3>Danh sách nhân viên</h3>

        </div>
        <div *ngIf="selectedMenu == MenuCreatePartner.AccountInfomation">
          AccountInfomation
        </div>
      </div>

    </div>
  </div>
</div>
