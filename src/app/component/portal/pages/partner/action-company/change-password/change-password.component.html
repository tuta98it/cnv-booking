<nz-modal [(nzVisible)]="isVisible" nzTitle="Đổi mật khẩu"
  (nzOnCancel)="handleCancel()" (nzOnOk)="handleSave()" nzMaskClosable="false">
  <div *nzModalContent>
    <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }">
      <div nz-col class="gutter-row" [nzSpan]="24">
        <form [formGroup]="formChangePassword">
          <div>
            <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
              style="display: flex; align-items: center; padding: 8px 0;">
              <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                Mật khẩu
                <span style="color: tomato; margin-left: 4px;">*</span>
              </div>
              <div nz-col class="gutter-row" [nzSpan]="18">
                <!-- <input style="border-radius: 4px;" nzSize="default" nz-input type="text"
                formControlName='amountDeposited' placeholder="Nhập số tiền nạp vào"> -->

                <nz-input-group  [nzSuffix]="suffixTemplate">
                  <input [type]="passwordVisible ? 'text' : 'password'" nz-input placeholder="Nhập mật khẩu"
                    autocomplete="new-password" formControlName="password" />
                </nz-input-group>
                <ng-template #suffixTemplate>
                  <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
                    (click)="passwordVisible = !passwordVisible"></i>
                </ng-template>
              </div>
            </div>

            <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32 }"
              style="display: flex; align-items: center; padding: 8px 0;">
              <div nz-col class="gutter-row" [nzSpan]="6" style="display: flex; align-items: center;">
                Nhắc lại
                <span style="color: tomato; margin-left: 4px;">*</span>
              </div>
              <div nz-col class="gutter-row" [nzSpan]="18">
                <nz-input-group  [nzSuffix]="suffixRepeatTemplate">
                  <input [type]="repeatpasswordVisible ? 'text' : 'password'" nz-input placeholder="Nhập lại mật khẩu"
                    autocomplete="new-password" formControlName="repeatPassword" />
                </nz-input-group>
                <ng-template #suffixRepeatTemplate>
                  <i nz-icon [nzType]="repeatpasswordVisible ? 'eye-invisible' : 'eye'"
                    (click)="repeatpasswordVisible = !repeatpasswordVisible"></i>
                </ng-template>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div *nzModalFooter>
    <button nz-button nzDanger nzType="text" (click)="handleCancel()">
      <div style="display: flex; align-items: center;">
        <span nz-icon nzType="close"></span>
        <span style="margin-left: 4px; line-height: normal;">Huỷ</span>
      </div>
    </button>

    <!-- [nzLoading]="isDepositAccountOkLoading"  -->
    <button nz-button nzType="default" style="margin-right: 8px;" (click)="handleSave()">
      <div style="display: flex; align-items: center;">
        <span nz-icon nzType="save"></span>
        <span style="margin-left: 6px; line-height: normal;">Cập nhật</span>
      </div>
    </button>
  </div>
</nz-modal>
