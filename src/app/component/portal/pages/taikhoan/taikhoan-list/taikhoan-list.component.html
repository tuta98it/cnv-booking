<dx-data-grid id="gridContainer" [dataSource]="filteredDatas" #ListAccount [showColumnLines]="true"
  [showRowLines]="true" [height]="dxGridHeight" [rowAlternationEnabled]="true" [showBorders]="true"
  [allowColumnResizing]="true" columnResizingMode="widget" [columnMinWidth]="50" [columnAutoWidth]="true"
  (onExporting)="onExporting($event)">
  <dxo-scrolling mode="virtual"></dxo-scrolling>
  <dxo-sorting mode="multiple"></dxo-sorting>

  <dxo-paging [pageSize]="20"> </dxo-paging>
  <dxo-scrolling rowRenderingMode="virtual"> </dxo-scrolling>
  <dxo-pager [visible]="true" [allowedPageSizes]="allowedPageSizes" [displayMode]="displayMode"
    [showPageSizeSelector]="showPageSizeSelector" [showInfo]="showInfo"
    [showNavigationButtons]="showNavButtons"></dxo-pager>


  <dxo-header-filter [visible]="true"></dxo-header-filter>
  <dxo-filter-row [visible]="true" [applyFilter]="currentFilter"></dxo-filter-row>
  <dxi-column cssClass="text-center" caption="Thao tác" [fixed]="true" [width]="170" fixedPosition="right"
    cellTemplate="cellBtnTemplate"></dxi-column>
  <dxi-column cssClass="text-center" caption="STT" [width]="55" dataField="stt" [fixed]="true" [allowFiltering]="false"
    [allowSorting]="false"></dxi-column>
  <dxi-column caption="Mã người dùng" dataField="userCode" [fixed]="true"></dxi-column>
  <dxi-column caption="Tên nhân viên" dataField="fullname" [fixed]="true"></dxi-column>
  <dxi-column caption="Chức danh" dataField="position" [fixed]="true"></dxi-column>
  <dxi-column caption="Email" dataField="email"></dxi-column>
  <dxi-column caption="Số điện thoại" dataField="phoneNo"></dxi-column>
  <dxi-column caption="Quản lý trực tiếp" dataField="directManagementUserName">
  </dxi-column>
  <dxi-column caption="Phòng ban" dataField="department"></dxi-column>
  <dxi-column caption="Trạng thái" dataField="statusText" cellTemplate="status"></dxi-column>
  <div *dxTemplate="let item of 'status'">
    <span [style.color]="COLOR_USER_STATUS[item.data.status]">{{item.value}}</span>
  </div>

  <div *dxTemplate="let item of 'cellBtnTemplate'" style="display: flex; justify-content: space-evenly;">

    <button title="Chỉnh sửa thông tin tài khoản" nz-button nzSize="small" nzType="default"
      (click)="showModalUpdate(item.data)" [disabled]="!item.data.status">
      <span class="fa fa-edit fa-fw"></span>
    </button>

    <!-- <button title="Đổi mật khẩu" nz-button nzSize="small" nzType="default" (click)="showModalPassword(item.data)"
      [disabled]="!item.data.status">
      <span class="fa fa-key fa-fw"></span>
    </button> -->

    <button title="Thiết lập lại mật khẩu mặc định" nz-button nzSize="small" nzType="default" (click)="showResetPassword(item.data)"
      [disabled]="!item.data.status" [nzLoading]="item.data.isLoadingResetPassword">
      <span class="fa fa-key fa-fw"></span>
    </button>

    <button *ngIf="item?.data?.status != UserStatus.LOCKED" title="Khoá nhân viên" nz-button nzSize="small"
      nzType="default" class="btn-right button-update ant-btn-red" (click)="handleLockEmployee(item.data)">
      <span class="fa fa-lock fa-fw"></span>
    </button>

    <button *ngIf="item?.data?.status == UserStatus.LOCKED" title="Mở khoá nhân viên" nz-button nzSize="small"
      nzType="default" class="btn-right button-update" (click)="handleUnLockEmployee(item.data)">
      <span class="fa fa-unlock fa-fw"></span>
    </button>

    <!-- <nz-switch [ngModel]="item.data.status" [nzControl]="true" [nzCheckedChildren]="checkedTemplateUser"
      [nzUnCheckedChildren]="unCheckedTemplateUser" [nzLoading]="item.data.isLoadingActiveUser"
      (click)="showIsActiveUserConfirm(item.data)"></nz-switch>
    <ng-template #checkedTemplateUser><span nz-icon nzType="user"></span></ng-template>
    <ng-template #unCheckedTemplateUser><span nz-icon nzType="user-delete"></span></ng-template> -->
  </div>
  <dxo-summary>
    <dxi-total-item column="userCode" displayFormat="Số bản ghi: {0}" summaryType="count">
    </dxi-total-item>
  </dxo-summary>
</dx-data-grid>

<form [formGroup]="formAdd" (ngSubmit)="handleOk()">
  <nz-modal [(nzVisible)]="isVisibleAdd" nzClosable="false" [nzTitle]="title" nzMaskClosable="false">
    <ng-template #title>
      {{titleFormUser}}
      <div class="pull-right icon-close">
        <em (click)="handleCancel()" nz-icon nzType="close" nzTheme="outline"></em>
      </div>
    </ng-template>
    <div class="modal-update">
      <div class="input-wrap" nz-row *ngIf="isAddForm == false">
        <label class="title-detail" nz-col [nzSpan]="8">Mã người dùng</label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="userCode" class="form-control form-control-disabled" disabled/>
        </div>
      </div>
      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Họ và tên<em class="fas fa-asterisk required"></em></label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="fullname" placeholder="Nhập họ và tên nhân viên" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.fullname.errors?.required }" />
        </div>
      </div>

      <div class="input-wrap">
        <label class="title-detail" nz-col [nzSpan]="8">Chức danh</label>
        <div nz-col [nzSpan]="16">
          <ng-container *ngIf="isAddForm == false; else elseTemplate">
              <input nz-input formControlName="position" class="form-control form-control-disabled"
                 />
          </ng-container>
          <ng-template #elseTemplate>
              <select nz-select formControlName="titleId" class="form-control"
               >
                <option value="" disabled selected hidden>Chọn chức danh</option>
                <option *ngFor="let pos of listPosition" [value]="pos.id">{{ pos.name }}</option>
              </select>
          </ng-template>
        </div>
      </div>

      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Email<em class="fa fa-asterisk required"></em></label>
        <div nz-col [nzSpan]="16">
          <input type="email" nz-input formControlName="email" placeholder="Nhập email nhân viên" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.email.errors?.required }" />
        </div>
      </div>

      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Số điện thoại<em class="fa fa-asterisk required"></em></label>
        <div nz-col [nzSpan]="16">
          <input nz-input formControlName="phoneNo" placeholder="Nhập số điện thoại nhân viên" #inputElementNumberPhone class="form-control"
            (ngModelChange)="onChangeNumberPhone($event)"
            [ngClass]="{ 'is-invalid': submitted && f.phoneNo.errors?.required }" />
        </div>
      </div>

      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Quản lý trực tiếp</label>
        <div nz-col [nzSpan]="16">
        <ng-container *ngIf="isAddForm == false ; else elseTemplate1">
            <input nz-input formControlName="directiveManagementUser" class="form-control form-control-disabled"/>
        </ng-container>
        <ng-template #elseTemplate1>
          <select formControlName="directManagementUserId" class="form-control"
         >
          <option value="" disabled selected hidden>Chọn quản lý trực tiếp của nhân viên</option>
          <option *ngFor="let dir of listDirectiveManagement" [value]="dir.id">{{ dir.fullname }}</option>
        </select>
        </ng-template>
      </div>
      </div>

      <div class="input-wrap" nz-row>
        <label class="title-detail" nz-col [nzSpan]="8">Phòng ban</label>
        <div nz-col [nzSpan]="16">
          <ng-container *ngIf="isAddForm == false; else elseTemplate2">
            <input nz-input formControlName="department" class="form-control form-control-disabled"/>
          </ng-container>
          <ng-template #elseTemplate2>
            <input nz-input formControlName="department" placeholder="Nhập phòng ban của nhân viên" class="form-control"/>
          </ng-template>
        </div>
      </div>

    </div>
    <!-- Footer -->
    <div *nzModalFooter>
      <button nz-button (click)="handleCancel()" class="button-cancel"><span nz-icon nzType="close" nzTheme="outline"></span> {{'cancel' | translate }}</button>
      <button nz-button nzType="primary" (click)="handleOk()" class="button-submit"><span nz-icon nzType="save" nzTheme="outline"></span> {{'save' | translate }}</button>
    </div>
  </nz-modal>
</form>

<form [formGroup]="formPassword" (ngSubmit)="handleOkPassword()">
  <nz-modal [(nzVisible)]="isVisiblePassword" nzClosable="false" [nzTitle]="titlePassword" nzMaskClosable="false">
    <ng-template #titlePassword>
      Đổi mật khẩu
      <div class="pull-right icon-close">
        <em (click)="handleCancelPassword()" nz-icon nzType="close" nzTheme="outline"></em>
      </div>
    </ng-template>
    <div class="input-wrap">
      <label class="title-detail" nz-col [nzSpan]="8">Mật khẩu<em class="fa fa-asterisk required"></em></label>
      <nz-input-group style="width: auto !important;" [nzSuffix]="suffixTemplate" nz-col [nzSpan]="16">
        <input [type]="passwordVisible ? 'text' : 'password'" nz-input placeholder="Nhập mật khẩu"
          autocomplete="new-password" formControlName="password" />
      </nz-input-group>
      <ng-template #suffixTemplate>
        <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
          (click)="passwordVisible = !passwordVisible"></i>
      </ng-template>
    </div>
    <div class="input-wrap">
      <label class="title-detail" nz-col [nzSpan]="8">Nhắc lại<em class="fa fa-asterisk required"></em></label>
      <nz-input-group style="width: auto !important;" [nzSuffix]="suffixRepeatTemplate" nz-col [nzSpan]="16">
        <input [type]="repeatpasswordVisible ? 'text' : 'password'" nz-input placeholder="Nhập lại mật khẩu"
          formControlName="repeatPassword" />
      </nz-input-group>
      <ng-template #suffixRepeatTemplate>
        <i nz-icon [nzType]="repeatpasswordVisible ? 'eye-invisible' : 'eye'"
          (click)="repeatpasswordVisible = !repeatpasswordVisible"></i>
      </ng-template>
    </div>
    <!-- Footer -->
    <div *nzModalFooter>
      <button nz-button (click)="handleCancelPassword()">{{'cancel' | translate }}</button>
      <button nz-button nzType="primary" (click)="handleOkPassword()" class="button-submit">{{'save' | translate
        }}</button>
    </div>
  </nz-modal>
</form>

<nz-modal [(nzVisible)]="isVisibleUserGroup" nzClosable="false" [nzTitle]="titleUserGroup" nzMaskClosable="false">
  <ng-template #titleUserGroup>
    Danh mục chức danh
    <div class="pull-right icon-close">
      <em (click)="handleCancelUserGroup()" nz-icon nzType="close" nzTheme="outline"></em>
    </div>
  </ng-template>
  <div class="row">
    <div class="col-md-9">
      <nz-select style="width: 100%" nzShowSearch [(ngModel)]="chooseGroup" nzPlaceHolder="Chọn nhóm tài khoản"
        class="input-search" [nzShowArrow]="true">
        <nz-option *ngFor="let o of groups" [nzLabel]="o.name" [nzValue]="o">
        </nz-option>
      </nz-select>
    </div>
    <div class="col-md-3">
      <button nz-button nzType="primary" (click)="addGroup2User()" class="button-submit right">Thêm mới</button>
    </div>
  </div>
  <br>
  <div class="data-table">
    <nz-table #basicTable [nzData]="usergroups" [nzPageSizeOptions]="pageSize" [nzPageSize]="defaultPage"
      nzShowSizeChanger [nzShowTotal]="rangeTemplate" [nzLoading]="loading">
      <thead>
        <tr>
          <th class="text-nowrap" width="50px">#</th>
          <th class="text-nowrap">Chức vụ</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of usergroups;let i = index;">
          <td class="text-nowrap">{{i + 1}}</td>
          <td class="text-nowrap">{{ data.name }}</td>
          <td class="text-nowrap">
            <button title="Xóa nhóm" nz-button nzSize="small" nzType="default" class="btn-right button-update"
              (click)="showConfirmRemoveGroup(data.id)">
              <span class="fa fa-times fa-fw"></span>
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>
    <ng-template #rangeTemplate let-range="range" let-total>
      {{ range[0] }}-{{ range[1] }} {{'of' | translate }} {{ total }} {{'items' | translate }}
    </ng-template>
  </div>
  <!-- Footer -->
  <div *nzModalFooter>
    <button nz-button (click)="handleCancelUserGroup()">{{'cancel' | translate }}</button>
  </div>
</nz-modal>
