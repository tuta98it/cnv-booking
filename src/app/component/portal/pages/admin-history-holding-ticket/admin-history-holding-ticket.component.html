<div class="action-button" style="clear: bottom;overflow: hidden;">
  <div class="form-group" style="float: left">
    <h1>Quản lý giữ vé</h1>
  </div>
  <div class="form-group" style="float: right; display: flex; float: right">
    <!-- Tìm kiếm -->
    <input style="width: 200px; border-radius: 4px; height: 32px;" class="mgr10" nzSize="small" nz-input type="text"
      [(ngModel)]="searchText" (keyup)="onSearch()" placeholder="Tìm kiếm theo Tên người đặt vé, SĐT, Email ...">
    <!-- Nút xuất Excel -->
    <button nz-button nzType="primary" class="btn-green mgr10" (click)="exportData()">
      <span class="fa fa-fw fa-file-excel" style="margin-right: 4px;"></span>
      Xuất Excel
    </button>
  </div>
</div>

<dx-data-grid id="gridContainer" [dataSource]="filteredDatas" #ListAccount [showColumnLines]="true"
  [showRowLines]="true" [height]="dxGridHeight" [rowAlternationEnabled]="true" [showBorders]="true"
  [allowColumnResizing]="true" columnResizingMode="widget" [columnMinWidth]="50" [columnAutoWidth]="true"
  (onExporting)="onExporting($event)">
  <dxo-load-panel [enabled]="true"></dxo-load-panel>
  <dxo-scrolling mode="virtual"></dxo-scrolling>
  <dxo-sorting mode="multiple"></dxo-sorting>
  <dxo-header-filter [visible]="true"></dxo-header-filter>
  <dxo-filter-row [visible]="true" [applyFilter]="currentFilter"></dxo-filter-row>

  <dxi-column cssClass="text-center" caption="STT" [width]="55" dataField="stt" [fixed]="true" [allowFiltering]="false"
    [allowSorting]="false"></dxi-column>
  <dxi-column caption="Tên người đặt vé" [width]="250" dataField="contactName"></dxi-column>
  <dxi-column caption="SĐT" dataField="contactPhone" [width]="250"></dxi-column>
  <dxi-column caption="Email" [width]="250" dataField="contactEmail"></dxi-column>
  <dxi-column caption="Ngày đặt vé" dataField="dateCreated" dataType="date" format="HH:mm dd/MM/yy"></dxi-column>
  <dxi-column caption="Thông tin vé" cssClass="text-center" [width]="200" cellTemplate="cellInfoTickets"></dxi-column>
  <div *dxTemplate="let item of 'cellInfoTickets'">
    <a nz-button nzType="link" (click)="previewDetailTransactionHistoryTickets(item.data)" nzBlock>«Chi tiết»</a>
  </div>

  <dxo-summary>
    <dxi-total-item column="contactName" displayFormat="Số bản ghi: {0}" summaryType="count">
    </dxi-total-item>
  </dxo-summary>
</dx-data-grid>


<nz-modal [(nzVisible)]="isVisibleDetailTransactionHistoryTickets" nzTitle="Thông tin chi tiết" [nzContent]="content"
  [nzFooter]="footer" nzWidth="1500px" (nzOnCancel)="handleCancel()">
  <ng-template #content>
    <dx-data-grid id="gridContainer" [dataSource]="listDetailTicket" #ListAccount [showColumnLines]="true"
      [showRowLines]="true" [height]="dxGridHeight" [rowAlternationEnabled]="true" [showBorders]="true"
      [allowColumnResizing]="true" columnResizingMode="widget" [columnMinWidth]="50" [columnAutoWidth]="true"
      (onExporting)="onExporting($event)">


      <dxo-load-panel [enabled]="true"></dxo-load-panel>`
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-sorting mode="multiple"></dxo-sorting>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-filter-row [visible]="true" [applyFilter]="currentFilter"></dxo-filter-row>

      <dxi-column cssClass="text-center" caption="STT" [width]="55" dataField="stt" [fixed]="true"
        [allowFiltering]="false" [allowSorting]="false"></dxi-column>
      <dxi-column caption="Tên" [fixed]="true" [width]="150" dataField="firstName" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Họ" [fixed]="true" dataField="lastName" [width]="100"></dxi-column>
      <dxi-column caption="Ngày sinh" dataField="dateOfBirth" [width]="150" dataType="date" format="dd/MM/yy" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Giới tính" dataField="gender" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Hãng bay" dataField="airlineName" [width]="150" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Số hiệu chuyến bay" dataField="flightNumber" [width]="200" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Hạng" dataField="fareClass" [width]="100" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Cân nặng hành lý" dataField="baggageFee" [width]="100" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Thời gian cất cánh" dataField="startTime" [width]="200" dataType="date" format="HH:mm dd/MM/yy" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Thời gian hạ cánh" dataField="endTime" [width]="200" dataType="date" format="HH:mm dd/MM/yy" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Hành trình" dataField="fromToPoint" [width]="150" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Giá vé" dataField="price" dataType="number" cssClass="vertical-align-middle"></dxi-column>
      <dxi-column caption="Giữ vé" cssClass="text-center" dataField="status" [width]="100" [fixed]="true" fixedPosition="right"  cellTemplate="cellTicket"></dxi-column>
      <div *dxTemplate="let item of 'cellTicket'">
        <div *ngIf="item.data?.status === 'OK'">
          <a nz-button nzType="link" nzBlock>Xem vé</a>
        </div>
        <div *ngIf="item.data?.status === 'FAIL'">
          Lỗi đặt vé
        </div>
      </div>
      <dxo-summary>
        <dxi-total-item column="contactName" displayFormat="Số bản ghi: {0}" summaryType="count">
        </dxi-total-item>
      </dxo-summary>
    </dx-data-grid>
  </ng-template>

  <ng-template #footer> </ng-template>
</nz-modal>
