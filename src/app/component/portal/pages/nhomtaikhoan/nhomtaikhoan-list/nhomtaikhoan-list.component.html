<div style="display: flex; justify-content: space-between;">
  <h1>Danh mục chức danh</h1>
  <div class="form-filter ant-form ant-form-inline">
    <input style="width: 200px; margin-right: 10px;" st nzSize="small" nz-input [(ngModel)]="searchText" (keyup.enter)="onSearch()" type="text" placeholder="Tìm kiếm theo tên">
    <button nz-button nzType="primary" class="btn-add-asset" type="button" (click)="showModalAdd()" *ngIf="checkAdd">
      Thêm
    </button>
  </div>
</div>

<div class="data-table">
  <nz-table #basicTable [nzData]="filteredDatas"
            (nzCurrentPageDataChange)="currentPageDataChange($event)"
            [nzPageSizeOptions]="pageSize" [nzPageSize]="defaultPage" nzSize="small"
            nzShowSizeChanger [nzShowTotal]="rangeTemplate" [nzLoading]="loading">
    <thead>
      <tr>
        <!-- <th nzShowCheckbox nzLeft="0px" nzWidth="50px" [(nzChecked)]="isAllDisplayDataChecked"
            [nzIndeterminate]="isIndeterminate" (nzCheckedChange)="checkAllRow($event)"></th> -->
        <th class="text-nowrap" width="50px">STT</th>
        <th class="text-nowrap">Chức vụ</th>
        <th class="text-nowrap">Ghi chú</th>
        <th nzWidth="120px" class="text-nowrap text-center">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of basicTable.data;let i = index;">
        <!-- <td nzShowCheckbox [(nzChecked)]="mapOfCheckedId[data.id]" (nzCheckedChange)="refreshStatus()" nzLeft="0px"
            nzWidth="50px"></td> -->
        <td class="text-nowrap">{{getRowIndex(i, basicTable.nzPageIndex, basicTable.nzPageSize)}}</td>
        <td class="text-nowrap">{{ data.name }}</td>
        <td class="text-nowrap">{{ data.description }}</td>
        <td class="text-nowrap" style="display: flex;">
          <!--<button nz-button nzType="danger" class="btn-right" (click)="showConfirm(data.id)" *ngIf="checkDelete">{{'delete' | translate }}</button>
          <button nz-button nzType="default" class="btn-right button-update" (click)="showModalUpdate(data)" *ngIf="checkUpdate">Sửa</button>
          <button nz-button nzType="default" class="btn-right button-update" (click)="showModalUser(data)" *ngIf="checkUpdate">Tài khoản</button>-->
          <button nz-button nzSize="small" nzType="default" class="btn-right button-update" (click)="showModalUpdate(data)" *ngIf="checkUpdate">
            <span class="fa fa-edit fa-fw"></span>
          </button>
          <button nz-button nzSize="small" nzType="default" class="btn-right button-update" (click)="showModalUser(data)" *ngIf="checkUpdate">
            <span class="fa fa-user fa-fw"></span>
          </button>
          <button nz-button nzSize="small" nzType="default" class="btn-right" (click)="showConfirm(data.id)" *ngIf="checkDelete">
            <span class="fa fa-times fa-fw"></span>
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>
  <ng-template #rangeTemplate let-range="range" let-total>
    {{ range[0] }}-{{ range[1] }} {{'of' | translate }} {{ total }} {{'items' | translate }}
  </ng-template>
</div>

<form [formGroup]="formAdd" (ngSubmit)="handleOk()">
  <nz-modal [(nzVisible)]="isVisibleAdd" nzTitle="Add User" nzClosable="false" [nzTitle]="title" nzMaskClosable="false">
    <ng-template #title>
      Thông tin chức vụ
      <div class="pull-right icon-close">
        <em (click)="handleCancel()" nz-icon nzType="close" nzTheme="outline"></em>
      </div>
    </ng-template>
    <div class="input-wrap nz-row">
      <label class="title-detail" nz-col [nzSpan]="8">Chức vụ<em class="fa fa-asterisk required"></em></label>
      <div nz-col [nzSpan]="16">
        <input nz-input formControlName="name" />
      </div>
    </div>
    <div class="input-wrap nz-row">
      <label class="title-detail" nz-col [nzSpan]="8">Ghi chú</label>
      <div nz-col [nzSpan]="16">
        <input nz-input formControlName="description" />
      </div>
    </div>
    <!-- Footer -->
    <div *nzModalFooter>
      <button nz-button (click)="handleCancel()">{{'cancel' | translate }}</button>
      <button nz-button nzType="primary" (click)="handleOk()" class="button-submit">{{'save' | translate }}</button>
    </div>
  </nz-modal>
</form>

<app-nhomtaikhoan-users (closeModal)="closeModalUsers()" [isVisible]="isVisibleUser" [nhomtaikhoan]="item"></app-nhomtaikhoan-users>
